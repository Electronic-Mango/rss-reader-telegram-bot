[project]
name = "rss-reader-telegram-bot"
version = "1.0.0"
description = "A simple RSS reader Telegram bot."
readme = "README.md"
authors = [
    { name = "Electronic Mango", email = "78230210+Electronic-Mango@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "loguru>=0.7.3",
    "mergedeep>=1.3.4",
    "more-itertools>=11.1.0",
    "niquests>=3.21.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pymongo>=4.17.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot[callback-data,job-queue]>=22.8",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["src/main", "src/test"]
norecursedirs = [".venv"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src/main", "src/test"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",  # Type hinting settings YAML is problematic
    "BLE001",  # 'Exception' caught by design to prevent stopping update loop
    "COM812",  # Avoid issues with formatter
    "CPY001",  # I don't think, that copyright notices are necessary here
    "D1",      # Ignore all missing docstring rules
    "D203",    # Conflicts with D211
    "D212",    # Conflicts with D213
    "DTZ005",  # Quiet hours intentionally use host local time
    "DTZ901",  # Datetime is converted straight to 'struct_time' so 'tz' is irrelevant
    "FBT",
    "FIX002",
    "INP001",
    "PLR0913", # I think it makes sense for functions here to have more arguments
    "PLR0917", # Same as PLR0913
    "PLW0603", # 'global' DB client seems appropriate
    "S311",    # 'random' used in this project is for trivial purposes only
    "TD002",
    "TD003",
]
