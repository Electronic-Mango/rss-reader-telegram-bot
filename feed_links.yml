# Template YAML file, containing all possible RSS feed types and their parameters.
# Main keys are used as RSS feed names.
Feed name 1:
  # RSS feed link. Notice {source_pattern} substring, it will be replaced with whatever source you
  # input when adding a subscription.
  url: http://feedlink1.com/{source_pattern}/rss
  # Configure whether updates will contain RSS entry title.
  # Case-sensitive, defaults to "false".
  show_title: true
  # Configure whether updates will contain RSS entry description.
  # Case-sensitive, defaults to "false".
  show_description: true
  # List of strings which will be trimmed out of both title and description.
  # Filters are case-sensitive. Whole field defaults to an empty string.
  filters:
    - some string
    - some other string
  # String format used when creating update text to identify where the update comes from.
  # Elements "{name}" and "{type}" are replaced by specific feed name and feed type
  # (in this case "Feed name 1"). Both are optional.
  # This string is also converted to inline URL pointing to actual update.
  # Final string will be appended to the end of update description.
  # This string can contain basic HTML format tags. List of supported tags by Telegram bots:
  # https://core.telegram.org/bots/api#html-style
  # The field is optional, if absent a default text format is used:
  # "By <b>{name}</b> on {type}"
  sender_text_format: Posted by <b>{name}</b> in <i>{type}</i>!
Feed name 2:
  url: https://{source_pattern}.feedlink2.com/rss
  # Updates for this feed won't contain RSS entry description.
  show_title: true
  # "text" will be filtered out of update title.
  filters:
    - text
  # Entry filters allowing for filtering in/out specific RSS entries.
  # For each field, the corresponding regex will be applied to filter entries.
  # The regex doesn't have to match the entire field, but it must match it from the beginning.
  # If you need to match something in the middle, use ".*" at the beginning.
  # You can filter entries out via negative lookahead in the regex - "(?!.*pattern)".
  # The ".*" after "?!" ensures that the negative lookahead checks the entire field for the pattern.
  # Without it it won't exclude anything.
  entry_filters:
    # Only entries with "12345" somewhere in their ID are included.
    id: ".*12345"
    # Links with "ignored_section" somewhere in them are excluded.
    link: "(?!.*ignored_section)"
    # Only titles starting with this string are included.
    title: "Titles starting with this"
    # Entries with "Shouldn't be an RSS update!" somewhere in summary/description are excluded.
    summary: "(?!.*Shouldn't be an RSS update!)"
Feed name 3:
  url: https://{source_pattern}.feedlink2.com/rss
  media_override:
    pattern: https://{feed_type}_{feed_name}/{entry_id}_{entry_link}
    encode_http: false
  # Updates for this feed won't contain RSS entry titles or descriptions, just images and link.
  # The media attached for this entry will use the URL pattern specified in "media_override".
  # The override uses the string format syntax, available placeholders are:
  #   - {feed_type} - name of RSS type (here it's "Feed name 3")
  #   - {feed_name} - name of the specific RSS subscription
  #   - {entry_id} - ID of the specific RSS entry
  #   - {entry_link} - link to the specific RSS entry
  #   - {entry_date} - date of the specific RSS entry
  # "encode_http" specifies whether the placeholders should be percent-encoded for use in HTTP.
